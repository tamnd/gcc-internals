# The coverage ledger.
#
# Every item in every inventory here is covered, mentioned, or out of scope with a reason.
# `bpc coverage` reads the inventory out of the pinned GCC tree, not out of this file, so
# a statement code added to GCC 17 turns the build red until somebody decides what the book
# does about it. Rules match by shell glob and the first match wins, so put the specific
# ones above the general ones.
#
# The honest summary this produces is the point. A course that implies it covers all of GCC
# is not credible, and a published number turns an unfalsifiable claim into a fact.

[inventory.gimple-codes]
what = "GIMPLE statement codes"
source = "gcc/gimple.def"
macro = "DEFGSCODE"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_OMP_*"
status = "out of scope"
why = "OpenMP and OpenACC lowering is a subsystem of its own size, with its own pipeline and its own book to be written. The codes appear in the generated inventory so a reader can see how much of GIMPLE they are, which is a third of it."

[[inventory.gimple-codes.rule]]
match = "GIMPLE_TRANSACTION"
status = "out of scope"
why = "Transactional memory is off by default, has no active users the project can test against, and needs its own front end support to demonstrate."

[[inventory.gimple-codes.rule]]
match = "GIMPLE_ASSIGN"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_CALL"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_COND"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_PHI"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_RETURN"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_LABEL"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_GOTO"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_SWITCH"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_NOP"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_DEBUG"
status = "covered"

[[inventory.gimple-codes.rule]]
match = "GIMPLE_PREDICT"
status = "covered"

# Everything left is named where it comes up and not explained. Exception handling and the
# gimplifier's internal placeholders both deserve better than a mention and will get it in
# their own blueprints, at which point these rules move up into the covered list.
[[inventory.gimple-codes.rule]]
match = "GIMPLE_*"
status = "mentioned"

[inventory.gimple-layouts]
what = "GIMPLE layout structures"
source = "gcc/gsstruct.def"
macro = "DEFGSSTRUCT"

[[inventory.gimple-layouts.rule]]
match = "GSS_OMP*"
status = "out of scope"
why = "The layouts for the OpenMP codes, which are out of scope for the same reason the codes are."

[[inventory.gimple-layouts.rule]]
match = "GSS_BASE"
status = "covered"

[[inventory.gimple-layouts.rule]]
match = "GSS_WITH_OPS"
status = "covered"

[[inventory.gimple-layouts.rule]]
match = "GSS_WITH_MEM_OPS*"
status = "covered"

[[inventory.gimple-layouts.rule]]
match = "GSS_CALL"
status = "covered"

[[inventory.gimple-layouts.rule]]
match = "GSS_PHI"
status = "covered"

[[inventory.gimple-layouts.rule]]
match = "GSS_*"
status = "mentioned"

[inventory.plugin-events]
what = "plugin events"
source = "gcc/plugin.def"
macro = "DEFEVENT"

# The events `BP-PLUGIN` describes with their call site, their data and what an observer can
# do with them. These are the ones a reader of this book will actually register for, because
# they are the ones that see the pipeline.

[[inventory.plugin-events.rule]]
match = "PLUGIN_PASS_EXECUTION"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_OVERRIDE_GATE"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_NEW_PASS"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_PASS_MANAGER_SETUP"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_INFO"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_ALL_PASSES_*"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_START_UNIT"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_FINISH_UNIT"
status = "covered"

[[inventory.plugin-events.rule]]
match = "PLUGIN_FINISH"
status = "covered"

# The garbage collector's own events. A plugin that allocates GC memory needs all four and
# none of them can be explained without `BP-GGC`, which does not exist yet. They are named
# in section 7 of `BP-PLUGIN` with what fires them and nothing about what to do inside one.
[[inventory.plugin-events.rule]]
match = "PLUGIN_GGC_*"
status = "mentioned"

[[inventory.plugin-events.rule]]
match = "PLUGIN_REGISTER_GGC_ROOTS"
status = "mentioned"

# Everything left is a front end event, an IPA bracket, or one of the two registration
# moments for attributes and pragmas. Each is in the generated table in section 2.1 with its
# call site and the type of its data, which is more than GCC writes down anywhere, and none
# of them is explained. Explaining them needs a blueprint about GENERIC and one about the
# call graph, and both are ahead of this one.
[[inventory.plugin-events.rule]]
match = "PLUGIN_*"
status = "mentioned"

# The front ends. This is the inventory that most needs stating, because a course about GCC
# that teaches C and calls itself a course about GCC is making a claim it has not earned.
# GCC's middle end is shared and its front ends are not, and twelve of the fourteen below
# are never opened here.
[inventory.front-ends]
what = "front ends"
source = "gcc/*/config-lang.in"
provider = "front-ends"

[[inventory.front-ends.rule]]
match = "c"
status = "covered"

[[inventory.front-ends.rule]]
match = "c++"
status = "covered"

[[inventory.front-ends.rule]]
match = "lto"
status = "mentioned"

# Named in BP-BUILD's generated table with its compiler and its default, and never opened.
# Each of these is a language front end of between twenty thousand and half a million lines,
# and covering one properly means teaching that language's semantics first.
[[inventory.front-ends.rule]]
match = "*"
status = "out of scope"
why = "This course teaches the middle end and the back end through C and C++, which are the two front ends every reader can already read. Another front end would add a language to learn before the compiler, and would teach nothing about the shared pipeline that C does not already teach."

# The --enable-checking categories. These decide what the compiler verifies about its own
# IR at run time, which is the difference between a pass bug that fails a test and one that
# silently miscompiles, so the book has to say which of them it relies on.
[inventory.checking-categories]
what = "--enable-checking categories"
source = "gcc/configure.ac"
provider = "checking-categories"

[[inventory.checking-categories.rule]]
match = "misc"
status = "covered"

[[inventory.checking-categories.rule]]
match = "extra"
status = "covered"

[[inventory.checking-categories.rule]]
match = "rtl"
status = "covered"

[[inventory.checking-categories.rule]]
match = "tree"
status = "covered"

[[inventory.checking-categories.rule]]
match = "gimple"
status = "covered"

[[inventory.checking-categories.rule]]
match = "valgrind"
status = "out of scope"
why = "It needs valgrind found at configure time and runs every subprocess under it, which GCC itself calls extremely expensive. The build matrix has no configuration that could afford it. It is named in BP-BUILD's generated table with its cost and never used."

# The rest are in the generated table with the macro each one defines and what GCC says it
# costs, which is enough to choose one, and not enough to call them explained.
[[inventory.checking-categories.rule]]
match = "*"
status = "mentioned"

# The --with-build-config fragments. Each one is a makefile included by every stage of a
# bootstrap, and between them they are how a bootstrap is made to prove something other
# than that the compiler is deterministic. A reader who wants the bootstrap to catch a
# specific class of bug picks from this list, so the book has to say which ones it means.
[inventory.build-configs]
what = "--with-build-config fragments"
source = "config/"
provider = "build-configs"

# The two that turn the comparison into a check that -g does not change generated code.
# BP-BOOTSTRAP section 7 says what that proves and why -gtoggle exists because of it.
[[inventory.build-configs.rule]]
match = "bootstrap-debug"
status = "covered"

[[inventory.build-configs.rule]]
match = "bootstrap-debug-lean"
status = "covered"

# The one that changes what the stages are compiled with rather than what they check, and
# the only one this project's build matrix could plausibly grow a configuration for.
[[inventory.build-configs.rule]]
match = "bootstrap-lto"
status = "covered"

[[inventory.build-configs.rule]]
match = "bootstrap-debug-ckovw"
status = "out of scope"
why = "It forces GCC_COMPARE_DEBUG on for every host and target compilation, and its own comment says it is only meaningful alongside bootstrap-debug-lean and bootstrap-debug-lib in a full bootstrap. That is three fragments and the target libraries as well, hours past what the boot configuration already costs, to check a property BP-BOOTSTRAP can state without running it."

[[inventory.build-configs.rule]]
match = "bootstrap-native"
status = "out of scope"
why = "It adds -march=native, so the compiler it builds runs on the machine that built it and nowhere else. Every image this project publishes has to run on both of GitHub's runner generations, so nothing here can use it and no lesson can reproduce a result from it."

# The rest are in BP-BOOTSTRAP's generated table with GCC's own one line description and
# what each of them changes, which is enough to choose one and not enough to teach it.
[[inventory.build-configs.rule]]
match = "*"
status = "mentioned"
