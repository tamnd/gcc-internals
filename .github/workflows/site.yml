name: site

on:
  push:
    branches: [main]
  pull_request:

# The site build runs the notebooks, because an island carries the output it was built with
# and that output has to be real. Notebooks are written to notice they are not in a browser
# and render their before state, so this job never touches a live API.

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a push that lands while one is running wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,site]"

      # The island tests only have something to test when marimo is here.
      - run: python -m pytest -q tests/test_island.py

      # The blueprint pages are generated and the navigation lists them by hand, so both can
      # drift. MkDocs will build a page nothing links to and `--strict` does not mind, which
      # means a blueprint added without a nav entry would publish as a URL only its author
      # knows. This is the check that catches it, and it needs the blueprints rather than the
      # pinned GCC tree, so it belongs here rather than in the citations job.
      - run: python -m tools.bpc pages --check

      - run: python -m mkdocs build --strict -f site/mkdocs.yml

      # A build that quietly stopped producing islands still looks like a good build, so
      # say out loud that the one page that has to have one still does.
      - name: the probe page really has an island in it
        run: grep -q "marimo-island" site/_build/probe/index.html

      # The glossary page is a one line include of GLOSSARY.md, so a broken snippet path
      # gives you a page that builds fine and has nothing on it.
      - name: the glossary page really pulled the glossary in
        run: grep -q 'id="phi-node"' site/_build/glossary/index.html

      # Same failure mode as the glossary, nine more times. A blueprint page is a one line
      # snippet include, so a wrong path gives a page that builds fine and holds a comment.
      - name: every blueprint page really pulled its blueprint in
        run: |
          for f in blueprints/BP-*.md; do
            id=$(basename "$f" .md)
            grep -q "Applies to" "site/_build/blueprints/$id/index.html" || {
              echo "$id published as an empty page"
              exit 1
            }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    name: publish to pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
