name: ci

on:
  push:
    branches: [main]
  pull_request:

# The per push set has to stay under about twenty five minutes. Past that, authors stop
# running it locally and start pushing to see whether CI is happy, which is the beginning
# of the end for a docs project.

jobs:
  lint:
    name: lint and prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .
      - name: prose rules
        run: python -m tools.prosecheck README.md CONTRIBUTING.md LICENSE.md GLOSSARY.md docs lessons blueprints containers corpora/programs

      # The table in containers/README.md is generated from containers/matrix.toml, and a
      # hand edit to either one is how the two start describing different compilers.
      - name: the build matrix table matches the build matrix
        run: python -m tools.matrix table --check

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  lessons:
    name: lessons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A notebook is a build artifact that happens to be committed, because a Colab badge
      # has to point at a real file in the default branch. Everything here is about the two
      # copies not drifting apart.
      - run: pip install -e ".[dev,lessons]"

      - name: every notebook matches its build.py
        run: python -m tools.nbbuild check

      - name: every claim still has a cell under it
        run: python -m tools.nbbuild verify

      - name: every Excalidraw scene matches its diagram.py
        run: |
          for f in lessons/*/diagram.py; do python "$f"; done
          git diff --exit-code lessons

      # The only evidence a lesson still works, since outputs are never committed. It is not
      # evidence that a lesson is right, which is what reading `run --show` is for, but a
      # cell that has started raising is caught here rather than by a reader in Colab.
      - name: every lesson runs top to bottom
        run: python -m tools.nbbuild run

      # A boss fight nobody has watched fail is a boss fight that might be waving everything
      # through, so both directions are checked.
      - name: the boss fights grade a right answer and a wrong one
        run: |
          python lessons/z01-cpp-for-reading/grade.py --says loop,cast,poly,gty,include,treemacro,gimple,wide,dump,gsi,pass,vec
          ! python lessons/z01-cpp-for-reading/grade.py --says gsi,cast,poly,gty,include,treemacro,gimple,wide,dump,gsi,pass,vec
          python lessons/z02-where-things-are/grade.py --says gcc/cfgloop.cc:163,gcc/tree-cfg.cc:1980,gcc/tree-ssa-propagate.cc:486,gcc/tree-ssa-ccp.cc:3083,gcc/tree-cfg.cc:2193:2004,gcc/match.pd:239:2014
          ! python lessons/z02-where-things-are/grade.py --says gcc/cfgloop.cc:163,gcc/tree-cfg.cc:1980,gcc/tree-ssa-ccp.cc:486,gcc/tree-ssa-ccp.cc:3083,gcc/tree-cfg.cc:2193,gcc/match.pd:239
          python lessons/t01-what-gcc-runs/grade.py --steps 1,1,2,3 --shared cc1 --to-as no
          ! python lessons/t01-what-gcc-runs/grade.py --steps 2,2,2,2 --shared as --to-as yes
          python lessons/t02-five-faces/grade.py --asm 5=2,6=6,7=1,8=0 --vanished 8 --appeared 9
          ! python lessons/t02-five-faces/grade.py --asm 5=1,6=1 --vanished 9 --appeared 8
          python lessons/t03-gimple-is-c-with-the-fun-removed/grade.py --ops "+,-,*,+,-,*,+" --temps 6 --most shortcircuit
          ! python lessons/t03-gimple-is-c-with-the-fun-removed/grade.py --ops "*,+,-" --temps 2 --most flat
          python lessons/t04-three-hundred-and-ninety-five-passes/grade.py --pass ccp1 --changed 25 --only-os hoist
          ! python lessons/t04-three-hundred-and-ninety-five-passes/grade.py --pass dom2 --changed 3 --only-os vect
          python lessons/t05-ssa-in-one-lesson/grade.py --phis 3 --most total --defaults yes
          ! python lessons/t05-ssa-in-one-lesson/grade.py --phis 2 --most k --defaults no
          python lessons/t06-what-o2-actually-turns-on/grade.py --flags 4 --odd-one-out -freorder-blocks-algorithm=stc --switches-only 86
          ! python lessons/t06-what-o2-actually-turns-on/grade.py --flags 7 --odd-one-out -falign-loops=32:16 --switches-only 56
          python lessons/t07-where-gimple-becomes-rtl/grade.py --answers A3 B1 C6 D2 E5 F4 --clobbers x86-64 --no-flags riscv64
          ! python lessons/t07-where-gimple-becomes-rtl/grade.py --answers A1 B2 C3 D4 E5 F6 --clobbers aarch64 --no-flags power64le
          python lessons/t08-registers-are-a-lie-until-they-are-not/grade.py --spills p14,p20,p30 --available 15 --p20-memory 7
          ! python lessons/t08-registers-are-a-lie-until-they-are-not/grade.py --spills p20,p30 --available 16 --p20-memory 6
          python lessons/t09-the-last-mile/grade.py --patterns '*movsi_aarch64,*addsi3_aarch64,*do_return' --no-slash 2 --rows 21
          ! python lessons/t09-the-last-mile/grade.py --patterns '*addsi3_aarch64,*movsi_aarch64,*do_return' --no-slash 3 --rows 8

      - name: the glossary matches the module that generates it
        run: |
          python -m gxray.glossary
          git diff --exit-code GLOSSARY.md

      # The films are committed, unlike the diagrams, so this is the step that proves the
      # committed ones are still what the recorded corpus draws. The page goes with them
      # because its descriptions are the films' own alt text.
      - name: the films and the films page match the corpus
        run: |
          python -m gxmanim film
          git diff --exit-code docs/assets/films docs/films.md

  tier0:
    name: tier 0 parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Nothing in this job touches the network. The online half reads the Compiler Explorer
      # responses committed under tools/cecache/store, through a cache that raises on a miss,
      # so adding an experiment without running `just ce-refresh` fails here instead of
      # turning a green check into a bet on whether godbolt.org is up. Compiler Explorer is
      # free and run by volunteers and this project does not put it in anybody's CI loop.
      - name: every corpus entry and every lesson is registered
        run: python -m tools.tier0 coverage

      - name: every experiment runs out of the corpus
        run: python -m tools.tier0 offline

      - name: every experiment agrees with the cached live compiler
        run: python -m tools.tier0 online

      # The one thing the checks above cannot catch, because they read the cache rather than
      # what is committed. A response fetched and never committed passes on the laptop that
      # fetched it and fails for everybody else. status rather than diff, because an
      # uncommitted response is a new file and diff would not see it.
      - name: the cache has no uncommitted entries in it
        run: |
          test -z "$(git status --porcelain tools/cecache/store)" || {
            git status --porcelain tools/cecache/store
            echo "run just ce-refresh and commit what it writes"
            exit 1
          }

  dumpparse:
    name: dump parse baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Both dump parsers tolerate what they do not recognise instead of throwing, which is
      # what keeps one changed dump format from breaking forty lessons at once. It is also a
      # way to be quietly wrong for a year, so the amount tolerated is written down in
      # tools/dumpparse/baseline.json and checked here on every push.
      - name: every dump in the corpus reads the way the baseline says it does
        run: python -m tools.dumpparse check

      # Same reason as the cache check above. `record` writes a file, and a baseline recorded
      # on a laptop and left there passes for the person who wrote it and nobody else.
      - name: the baseline is the one this code writes
        run: |
          python -m tools.dumpparse record
          test -z "$(git status --porcelain tools/dumpparse)" || {
            git diff --stat tools/dumpparse
            echo "run just dumpparse-record and commit what it writes"
            exit 1
          }

  refcheck:
    name: citations and blueprints
    runs-on: ubuntu-latest
    steps:
      # The pinned GCC tree is about 1.3 GB shallow. It is the price of being able to
      # prove that every claim about the source still points where it did. This is the
      # only job that has the tree, so the blueprint checks live here too.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git -C vendor/gcc log --oneline -1
      - run: python -m tools.refcheck check

      # Not that the generated sections look right, but that regenerating them from the
      # pinned tree produces exactly what is committed.
      - name: generated sections are current
        run: python -m tools.bpc check

      # Prints the honest numbers into the log on every push, and fails when GCC has
      # something the ledger has never heard of.
      - name: coverage ledger
        run: python -m tools.bpc coverage

      # The parser tests that read the real tree only run where the tree exists.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_bpc.py tests/test_mdesc.py

      # The Z lessons read GCC's source rather than a compilation, through a corpus recorded
      # once and committed. refcheck proves the cited lines have not moved, and this proves
      # the committed corpus is what the recorder produces today, so a sentence edited in a
      # recorder cannot sit unrecorded and a bump cannot leave the corpus behind.
      - name: the source corpora match the recorders that write them
        run: |
          python lessons/z01-cpp-for-reading/record.py
          python lessons/z02-where-things-are/record.py
          git diff --exit-code corpora

  gcc:
    name: against a real gcc-16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is a trunk snapshot, not the pinned 16.2.0 release, because no distribution
      # packages the release yet. That is why the tests marked needs_gcc assert shapes and
      # relations rather than exact numbers: the parser has to keep working on a compiler
      # that is not the one the prose was measured against. The job that builds the pinned
      # compiler and checks the exact figures is the build matrix, which lands later.
      # add-apt-repository talks to Launchpad, which returns a 503 often enough to be
      # worth retrying. Without this the job fails for reasons that have nothing to do
      # with the change under review, and people learn to ignore a red check.
      - name: install gcc-16
        run: |
          for attempt in 1 2 3 4 5; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
            echo "launchpad said no, attempt $attempt"
            sleep $((attempt * 30))
          done
          sudo apt-get install -y gcc-16
          gcc-16 --version

      - run: pip install -e ".[dev]"
      - name: the tests that need a compiler
        run: python -m pytest -q -m needs_gcc

      # A drift signal rather than an assertion. If the parser stops understanding a dump,
      # the count moves and the log says by how much.
      - name: how much of a real pipeline the parser understands
        run: |
          python -m gxray passes --counts -O2
          python -m gxray dumps -O2 | tail -2

