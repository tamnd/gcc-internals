name: ci

on:
  push:
    branches: [main]
  pull_request:

# The per push set has to stay under about twenty five minutes. Past that, authors stop
# running it locally and start pushing to see whether CI is happy, which is the beginning
# of the end for a docs project.

jobs:
  lint:
    name: lint and prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .
      - name: prose rules
        run: python -m tools.prosecheck README.md CONTRIBUTING.md LICENSE.md docs lessons blueprints corpora/programs

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  lessons:
    name: lessons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A notebook is a build artifact that happens to be committed, because a Colab badge
      # has to point at a real file in the default branch. Everything here is about the two
      # copies not drifting apart.
      - run: pip install -e ".[dev,lessons]"

      - name: every notebook matches its build.py
        run: python -m tools.nbbuild check

      - name: every claim still has a cell under it
        run: python -m tools.nbbuild verify

      - name: every Excalidraw scene matches its diagram.py
        run: |
          for f in lessons/*/diagram.py; do python "$f"; done
          git diff --exit-code lessons

      # The only evidence a lesson still works, since outputs are never committed. It is not
      # evidence that a lesson is right, which is what reading `run --show` is for, but a
      # cell that has started raising is caught here rather than by a reader in Colab.
      - name: every lesson runs top to bottom
        run: python -m tools.nbbuild run

      # A boss fight nobody has watched fail is a boss fight that might be waving everything
      # through, so both directions are checked.
      - name: the boss fight grades a right answer and a wrong one
        run: |
          python lessons/t05-ssa-in-one-lesson/grade.py --phis 3 --most total --defaults yes
          ! python lessons/t05-ssa-in-one-lesson/grade.py --phis 2 --most k --defaults no

      - name: the glossary matches the module that generates it
        run: |
          python -m gxray.glossary
          git diff --exit-code GLOSSARY.md

  refcheck:
    name: citations and blueprints
    runs-on: ubuntu-latest
    steps:
      # The pinned GCC tree is about 1.3 GB shallow. It is the price of being able to
      # prove that every claim about the source still points where it did. This is the
      # only job that has the tree, so the blueprint checks live here too.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git -C vendor/gcc log --oneline -1
      - run: python -m tools.refcheck check

      # Not that the generated sections look right, but that regenerating them from the
      # pinned tree produces exactly what is committed.
      - name: generated sections are current
        run: python -m tools.bpc check

      # Prints the honest numbers into the log on every push, and fails when GCC has
      # something the ledger has never heard of.
      - name: coverage ledger
        run: python -m tools.bpc coverage

      # The parser tests that read the real tree only run where the tree exists.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_bpc.py

  gcc:
    name: against a real gcc-16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is a trunk snapshot, not the pinned 16.2.0 release, because no distribution
      # packages the release yet. That is why the tests marked needs_gcc assert shapes and
      # relations rather than exact numbers: the parser has to keep working on a compiler
      # that is not the one the prose was measured against. The job that builds the pinned
      # compiler and checks the exact figures is the build matrix, which lands later.
      # add-apt-repository talks to Launchpad, which returns a 503 often enough to be
      # worth retrying. Without this the job fails for reasons that have nothing to do
      # with the change under review, and people learn to ignore a red check.
      - name: install gcc-16
        run: |
          for attempt in 1 2 3 4 5; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
            echo "launchpad said no, attempt $attempt"
            sleep $((attempt * 30))
          done
          sudo apt-get install -y gcc-16
          gcc-16 --version

      - run: pip install -e ".[dev]"
      - name: the tests that need a compiler
        run: python -m pytest -q -m needs_gcc

      # A drift signal rather than an assertion. If the parser stops understanding a dump,
      # the count moves and the log says by how much.
      - name: how much of a real pipeline the parser understands
        run: |
          python -m gxray passes --counts -O2
          python -m gxray dumps -O2 | tail -2

