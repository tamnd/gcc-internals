[project]
name = "gcc-internals"
version = "0.0.1"
description = "Toolkit for the gcc-internals lessons: drive GCC, parse what it emits, and check the prose against it"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only needed to show a widget live in a notebook. Everything else works without it.
notebook = ["anywidget>=0.9"]
# Only needed to build the book. Marimo is here because the pages build their islands from
# real notebooks, so the site build runs them.
site = ["mkdocs-material>=9.5", "marimo>=0.24"]
# Only needed to execute a lesson notebook, which is how we prove the cells still run. A
# reader does not need this: Colab already has a kernel, and building a notebook from its
# build.py needs nothing but the standard library.
lessons = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]

[project.scripts]
gxray = "gxray.__main__:main"
bpc = "tools.bpc.__main__:main"
refcheck = "tools.refcheck.__main__:main"
prosecheck = "tools.prosecheck.__main__:main"
nbbuild = "tools.nbbuild.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gxmanim", "gxray", "gxwidgets", "tools"]

[tool.setuptools.package-data]
gxwidgets = ["static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The pinned GCC tree is somebody else's code, and parts of it are Python 2.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell shows a value by ending on a bare expression. That is the notebook format
# rather than a mistake, and it is the only thing about these files that is not ordinary
# Python.
"site/notebooks/*.py" = ["B018"]
# These two are prose in a Python file, and prosecheck reads what they generate. A paragraph
# is one line, the same rule the Markdown follows, because a sentence broken across source
# lines is a sentence somebody has to reflow every time they edit it.
"gxray/glossary.py" = ["E501"]
"tools/nbbuild/claims.py" = ["E501"]
"tools/nbbuild/cli.py" = ["E501"]
# A lesson builder is the same thing: the long lines are paragraphs and URLs, not code. Every
# prose block is an f-string whether or not it happens to interpolate anything, because
# adding a citation to a paragraph should not also mean remembering to add an f.
"lessons/*/build.py" = ["E501", "F541"]
# The setup cell in a lesson clones the repository and then imports from it, so the import
# has to come after the code. That is what the cell is for.
"lessons/*/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "needs_gcc: drives a real gcc-16 and is skipped when there is not one on PATH",
  "needs_network: talks to Compiler Explorer, never run in CI",
  "needs_marimo: builds a real island and needs the site extra installed",
  "needs_nbclient: runs a lesson in a real kernel and needs the lessons extra installed",
]
