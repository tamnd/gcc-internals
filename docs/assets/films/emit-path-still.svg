<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 334" width="342" height="334" role="img" aria-label="insn 12 becomes one line of assembly"><title>insn 12 becomes one line of assembly</title><desc>insn 12 becomes one line of assembly
Every step is printed somewhere. The first two come off the `-dp` annotation, the middle ones are in gcc/config/aarch64/aarch64.md:2694@releases/gcc-16.2.0, and the last one is the file.
insn 12, cost 4, 4 bytes
*addsi3_aarch64 (what the current paragraph is about)
alternative 1: rk , rk , r (modified in place)
add\t%w0, %w1, %w2 (a value the compiler knows)
add w0, w0, w1 (created by this pass)
insn to pattern, fallthrough
pattern to alternative, fallthrough
alternative to template, fallthrough
