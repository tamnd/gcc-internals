<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 482 214" width="482" height="214" role="img" aria-label="x86-64, 15 registers to hand out"><title>x86-64, 15 registers to hand out</title><desc>x86-64, 15 registers to hand out
One cell per value alive at the busiest point. Everything past the 15th cell has nowhere to go, and the lane where that first happens is the lane where the compiler starts writing to the stack.
p04, 6 live, 9 registers to spare, nothing in memory
p10, 12 live, 3 registers to spare, nothing in memory
p14, 16 live, 1 more than there are registers, 1 pseudo in memory
p20, 22 live, 7 more than there are registers, 7 pseudos in memory
