1 back, 5 fallthrough, 2 false, 2 true, in 1 loop
ENTRY, empty
&lt;bb 2&gt;, holding 3: total_4 = 0;; k_5 = 0;; goto &lt;bb 7&gt;; [INV]
&lt;bb 7&gt;, holding 6: # total_2 = PHI &lt; total_4(2), total_1(6)&gt;; # k_3 = PHI &lt; k_5(2), k_12(6)&gt;; if (k_3 &lt; n_6(D)); goto &lt;bb 3&gt;; [INV]; else; goto &lt;bb 8&gt;; [INV]
&lt;bb 3&gt;, holding 4: if (flag_9(D) != 0); goto &lt;bb 4&gt;; [INV]; else; goto &lt;bb 5&gt;; [INV]
&lt;bb 8&gt;, holding 2: _7 = total_2;; return _7;
&lt;bb 4&gt;, holding 2: total_11 = total_2 + k_3;; goto &lt;bb 6&gt;; [INV]
&lt;bb 5&gt;, holding 1: total_10 = total_2 - k_3;
EXIT, empty
&lt;bb 6&gt;, holding 2: # total_1 = PHI &lt; total_11(4), total_10(5)&gt;; k_12 = k_3 + 1;
