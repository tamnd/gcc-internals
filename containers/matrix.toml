# The build matrix.
#
# Six ways to build GCC, two architectures, one file that says what they are. Everything
# else reads this: the workflow builds the jobs it names, the Dockerfile takes its flags
# from it, the README table is generated from it, and `tools.matrix` refuses to let those
# three drift apart.
#
# The rule that makes any of this worth doing is that no job in this project compiles GCC
# except the matrix job. Everything else pulls an image by digest out of images.lock.json.
# A course whose test suite rebuilds a compiler is a course nobody can contribute to.
#
# A configuration is added by adding a table here and running `just matrix-table`. Nothing
# else needs editing, and CI fails if you edited something else instead.
#
# The minutes are measured on GitHub hosted runners with a cold cache, from the first run
# of this matrix, and they are the amd64 leg because it is the slower of the two every
# time. `boot` is the one number still estimated, because it never runs on a pull request
# and there has not been a scheduled run yet. The gigabytes are estimates except for
# `plug`, which was built and weighed.

# The tag the whole project is pinned to. Same one refcheck resolves citations against, and
# it has to stay that way, because a lesson that cites 16.2.0 and runs against 16.3.0 is a
# lesson that is wrong in a way nothing catches.
tag = "releases/gcc-16.2.0"
registry = "ghcr.io/tamnd/gcc-internals"

# Every from source configuration starts here. Kept in one place because the interesting
# part of a configuration is what it does differently, and a reader comparing two of them
# should not have to diff forty characters of boilerplate to find the four that matter.
[common]
languages = "c,c++"
install = "install-strip"
# The build that produced a compiler which cannot compile hello world has failed, and the
# image is the right place to find that out rather than the job that pulled it. A cross
# compiler has no libc to link against, so it overrides this with a compile and no link.
smoke = "gcc -O2 /tmp/t.c -o /tmp/t && /tmp/t"
configure = [
  "--prefix=/opt/gcc",
  "--disable-multilib",
  "--disable-nls",
  "--disable-libstdcxx-pch",
  "--with-system-zlib",
]

[[config]]
id = "rel"
purpose = "The fast development loop. Optimized, no bootstrap, and the one most jobs want."
configure = ["--disable-bootstrap"]
cflags = "-O2"
make = "all"
arches = ["amd64", "arm64"]
weekly = true
on_patches = true
minutes = 22
gigabytes = 1.2
why = "Everything that only needs a working GCC 16 uses this, so it is built the most often and kept the smallest."

[[config]]
id = "chk"
purpose = "Every internal consistency check GCC has, turned on."
configure = ["--disable-bootstrap", "--enable-checking=all,rtl,extra"]
cflags = "-O0 -g"
make = "all"
arches = ["amd64", "arm64"]
weekly = true
on_patches = true
minutes = 47
gigabytes = 4.0
why = "This is the build that catches a plugin corrupting the IR, and it is what the conformance harness runs against. A pass that only misbehaves under checking is the normal case, not the rare one."

[[config]]
id = "dbg"
purpose = "Unoptimized with full debug info, for the lessons that step through GCC in gdb."
configure = ["--disable-bootstrap", "--enable-checking=yes"]
cflags = "-O0 -g3"
make = "all"
arches = ["amd64", "arm64"]
weekly = true
on_patches = true
minutes = 35
gigabytes = 6.0
why = "At -O2 a debugger shows you a function whose locals have been optimized away and whose lines jump backwards. B03 is unteachable without -O0 -g3, and -g3 rather than -g because the macros are half of what you want to look at."

[[config]]
id = "boot"
purpose = "The full three stage bootstrap, with the stage two against stage three comparison."
configure = ["--enable-bootstrap", "--enable-checking=release"]
cflags = "-O2"
make = "bootstrap"
arches = ["amd64", "arm64"]
weekly = true
on_patches = false
minutes = 240
gigabytes = 8.0
why = "Bootstrap is a lesson in its own right, B02, and it is the oracle the conformance work leans on. It runs weekly and never on a push, because three to five hours per architecture is not something to spend on a typo fix."

[[config]]
id = "cross"
purpose = "A riscv64-unknown-elf cross compiler with newlib, for the back end lessons."
configure = [
  "--disable-bootstrap",
  "--target=riscv64-unknown-elf",
  "--with-newlib",
  "--without-headers",
  "--disable-libssp",
  "--disable-threads",
  # Installing the target binutils is not enough on its own, which cost a second CI round
  # trip to find out. The driver looks for the assembler under its own prefix, at
  # /opt/gcc/riscv64-unknown-elf/bin/as, and the distribution package puts it under
  # /usr/lib/riscv64-unknown-elf/bin/as. Nothing bridges those two, so the driver gives up
  # and runs the host `as`, which is where `unknown architecture rv64gc` comes from. These
  # two flags name the binaries outright and the driver stops searching.
  "--with-as=/usr/bin/riscv64-unknown-elf-as",
  "--with-ld=/usr/bin/riscv64-unknown-elf-ld",
]
languages = "c"
cflags = "-O2"
make = "all-gcc"
install = "install-gcc"
# A cross compiler is not a compiler on its own. GCC produces assembly and then calls the
# assembler for the target, and if there is not one it calls the host's, which reports
# `unknown architecture rv64gc` and looks like a GCC bug for about twenty minutes. The
# triple is riscv64-unknown-elf rather than the shorter riscv64-elf because that is the
# one Debian and Ubuntu package binutils under, and inventing our own triple would mean
# building binutils too.
packages = "binutils-riscv64-unknown-elf"
smoke = "riscv64-unknown-elf-gcc -O2 -c /tmp/t.c -o /tmp/t.o && riscv64-unknown-elf-objdump -d /tmp/t.o | grep -q ret"
arches = ["amd64", "arm64"]
weekly = true
on_patches = true
minutes = 18
gigabytes = 1.5
why = "The back end lessons need a target the reader is not running on, or every question about calling conventions and register allocation gets answered by accident. RISC-V because the manual is free and short."

[[config]]
id = "plug"
purpose = "A stock distribution GCC with gxplug built against it, and nothing compiled from source."
configure = []
cflags = ""
make = ""
arches = ["amd64", "arm64"]
weekly = true
on_patches = true
# Measured, amd64, cold cache: five minutes end to end and 1.72 GB in the registry. Most of
# both is the apt install of gcc-16 and gcc-16-plugin-dev, which is not something to shave.
minutes = 5
gigabytes = 1.7
why = "The five minute path, and the row that matters most to a reader. If the plugin only works against a compiler we built ourselves then the plugin does not work."
