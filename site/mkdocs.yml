site_name: GCC Internals
site_description: A visual, hands on teardown of GCC 16, taught from zero
site_url: https://tamnd.github.io/gcc-internals/
repo_url: https://github.com/tamnd/gcc-internals
repo_name: tamnd/gcc-internals
edit_uri: edit/main/
docs_dir: ../docs
site_dir: _build
copyright: Prose CC BY-SA 4.0, code GPLv3 or later

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # The glossary page is a snippet of GLOSSARY.md, which lives at the root of the repository
  # and is outside docs_dir. Paths are resolved from the working directory, and both `just
  # serve` and CI run from the root, so `.` is the one that hits. `..` is there for anyone
  # who runs mkdocs from inside site/. check_paths turns a missing include into a build
  # failure rather than a page with a stray marker on it.
  - pymdownx.snippets:
      base_path: [".", ".."]
      check_paths: true

# Builds the marimo islands the pages ask for. See tools/island.
hooks:
  - hooks.py

extra_css:
  - assets/gxray.css

extra_javascript:
  - assets/island.js

# The blueprint entries below are checked against the blueprints directory by
# `python -m tools.bpc pages --check`, because MkDocs will happily build a page nothing
# links to and `--strict` does not mind either, so a blueprint added without an entry here
# would ship as a URL only its author knows about.
nav:
  - Start here: index.md
  - Lessons: lessons.md
  - The films: films.md
  - Glossary: glossary.md
  - Blueprints:
    - What they are: blueprints.md
    - The pseudocode: blueprints/NOTATION.md
    - BP-PIPELINE, the shape of a compilation: blueprints/BP-PIPELINE.md
    - BP-DRIVER, the program that runs the other programs: blueprints/BP-DRIVER.md
    - BP-GIMPLE, the GIMPLE statement representation: blueprints/BP-GIMPLE.md
    - BP-CFG, blocks and edges: blueprints/BP-CFG.md
    - BP-SSA, one definition per name: blueprints/BP-SSA.md
    - BP-EXPAND, GIMPLE becomes RTL: blueprints/BP-EXPAND.md
    - BP-RTL, the RTL expression representation: blueprints/BP-RTL.md
    - BP-REGALLOC, giving out the machine's registers: blueprints/BP-REGALLOC.md
    - BP-FINAL, turning insns into text: blueprints/BP-FINAL.md
    - BP-PLUGIN, the plugin mechanism: blueprints/BP-PLUGIN.md
    - BP-BUILD, configuring and building the compiler: blueprints/BP-BUILD.md
  - How this is built:
    - The pinned tree and citations: pinned-tree.md
    - Can a browser compile C here: probe.md
