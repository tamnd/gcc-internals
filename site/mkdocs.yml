site_name: GCC Internals
site_description: A visual, hands on teardown of GCC 16, taught from zero
site_url: https://tamnd.github.io/gcc-internals/
repo_url: https://github.com/tamnd/gcc-internals
repo_name: tamnd/gcc-internals
edit_uri: edit/main/
docs_dir: ../docs
site_dir: _build
copyright: Prose CC BY-SA 4.0, code GPLv3 or later

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # The glossary page is a snippet of GLOSSARY.md, which lives at the root of the repository
  # and is outside docs_dir. Paths are resolved from the working directory, and both `just
  # serve` and CI run from the root, so `.` is the one that hits. `..` is there for anyone
  # who runs mkdocs from inside site/. check_paths turns a missing include into a build
  # failure rather than a page with a stray marker on it.
  - pymdownx.snippets:
      base_path: [".", ".."]
      check_paths: true

# Builds the marimo islands the pages ask for. See tools/island.
hooks:
  - hooks.py

extra_css:
  - assets/gxray.css

extra_javascript:
  - assets/island.js

nav:
  - Start here: index.md
  - Lessons: lessons.md
  - The films: films.md
  - Glossary: glossary.md
  - How this is built:
    - The pinned tree and citations: pinned-tree.md
    - Can a browser compile C here: probe.md
