site_name: GCC Internals
site_description: A visual, hands on teardown of GCC 16, taught from zero
site_url: https://tamnd.github.io/gcc-internals/
repo_url: https://github.com/tamnd/gcc-internals
repo_name: tamnd/gcc-internals
edit_uri: edit/main/
docs_dir: ../docs
site_dir: _build
copyright: Prose CC BY-SA 4.0, code GPLv3 or later

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - assets/gxray.css

nav:
  - Start here: index.md
  - How this is built:
    - The pinned tree and citations: pinned-tree.md
