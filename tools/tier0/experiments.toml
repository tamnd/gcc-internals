[[experiment]]
id = "t08-x86-64"
kind = "recorded"
question = "What does the register allocator do when there are sixteen registers?"
lessons = ["t08-registers-are-a-lie-until-they-are-not"]
corpus = "t08-x86-64"
compiler = "cg161"
dumps = ["rtl-ira"]
asm = true

[[experiment]]
id = "t08-aarch64"
kind = "recorded"
question = "What does the register allocator do when there are thirty one?"
lessons = ["t08-registers-are-a-lie-until-they-are-not"]
corpus = "t08-aarch64"
compiler = "carm64g1610"
dumps = ["rtl-ira"]
asm = true

[[experiment]]
id = "t08-local"
kind = "offline"
question = "Does a third compiler for the same target allocate the same way?"
lessons = ["t08-registers-are-a-lie-until-they-are-not"]
corpus = "t08-local"
why = """
This is the local aarch64-apple-darwin24 compiler, recorded so the lesson can put a third \
column next to the two Linux ones and show that the ABI and not just the register count \
moves the answer. Compiler Explorer has no Darwin compiler, so there is nothing to pair it \
with. The Tier 1 job in CI runs against a real gcc-16 and covers this one instead.\
"""

[[experiment]]
id = "t09-final"
kind = "recorded"
question = "How does an insn become a line of assembly?"
lessons = ["t09-the-last-mile"]
corpus = "t09-final"
compiler = "carm64g1610"
dumps = ["rtl-final"]
asm = true
raw_asm = true

[[experiment]]
id = "t09-sections"
kind = "recorded"
question = "Which section does each thing a program declares end up in?"
lessons = ["t09-the-last-mile"]
corpus = "t09-sections"
compiler = "carm64g1610"
dumps = ["rtl-final"]
asm = true
raw_asm = true

[[experiment]]
id = "t09-local"
kind = "offline"
question = "What do the -dp annotations look like on the compiler on this machine?"
lessons = ["t09-the-last-mile"]
corpus = "t09-local"
why = """
Local Darwin recording, same as t08-local, and paired with t09-final in the lesson to show \
that the Mach-O section names differ from the ELF ones while the insn names do not. No \
Darwin compiler exists on the service.\
"""

[[experiment]]
id = "t10-ladder"
kind = "paired"
question = "What does one function look like at every rung of the ladder at once?"
lessons = ["t10-the-whole-map"]
corpus = "t10-ladder"
compiler = "cg162"
dumps = ["tree-original", "tree-ssa"]

[[experiment]]
id = "t10-ladder-optimized"
kind = "paired"
question = "How much of the top of the ladder is the same on a different machine?"
lessons = ["t10-the-whole-map"]
corpus = "t10-ladder"
compiler = "cg162"
dumps = ["tree-optimized"]
agree = ["functions", "blocks"]
why = """
The same program as t06-l2 and the same ivopts difference, split off from the rung above it \
because the rungs below it do agree on everything. That contrast is the point. tree-original \
and tree-ssa are identical in shape on both machines because nothing target-aware has run \
yet, and tree-optimized is one PHI apart because ivopts has.\
"""

[[experiment]]
id = "t10-whole"
kind = "offline"
question = "What is the shape of the entire pipeline, all 146 dumps of it?"
lessons = ["t10-the-whole-map"]
corpus = "t10-whole"
why = """
Recorded with -fdump-tree-all and -fdump-rtl-all together, for the same reason t04-tape was \
and with the same consequence. The API returns the lot on stderr in one undelimited blob. \
The t10-ladder entry next to it is the paired half of this lesson.\
"""

[[experiment]]
id = "b01-configure"
kind = "offline"
question = "What does ./configure decide, and which of those decisions did you make?"
lessons = ["b01-the-build"]
why = """
The first experiment of Part II and the third offline one, for the same reason as z01 and \
z02. The subject is the source tree and the build matrix rather than anything a compiler \
emitted, so the evidence is corpora/configure/gcc.json and containers/matrix.toml. Both are \
recorded from files that CI already reads, which is what makes a configure line printed in \
the notebook a configure line that ran this week.\
"""

[[experiment]]
id = "b02-bootstrap"
kind = "offline"
question = "What does building the compiler three times prove, and what does it miss?"
lessons = ["b02-the-bootstrap"]
why = """
Offline for a reason that is different from the other four. The subject here is not a source \
tree, it is a four hour build whose interesting outcome almost never happens, and no \
experiment this course can run would produce one. So corpora/bootstrap/gcc.json carries six \
pairs of real object files with one comparison outcome induced into each, and the notebook \
runs GCC's own compare rule over them. The rule is real, the object files are real, and the \
scale is six instead of thirty thousand, which the lesson says where it matters.\
"""

[[experiment]]
id = "b03-debugger"
kind = "offline"
question = "What does the compiler look like from inside a debugger, and what do you do when you cannot have one?"
lessons = ["b03-the-debugger"]
why = """
Offline for a stronger reason than any of the other five have: the subject cannot be run by \
the reader at all. A gdb session against cc1 needs a compiler built with -O0 -g3, which is a \
three hundred megabyte binary out of a six gigabyte build, and it needs a gdb, which does not \
exist on macOS. So corpora/replay/cc1.json is a recorded session, twenty six commands with \
every byte of output kept, and the lesson says twice that a transcript is dated in a way the \
rest of the corpus is not. The half of the lesson that is not a recording is \
corpora/replay/counters.json, fifty real compilations at fifty debug counter limits, and the \
bisection over them runs when the reader runs the cell.\
"""

[[experiment]]
id = "b04-testsuite"
kind = "offline"
question = "How does the harness decide that a test passed, and how do you run one test out of forty thousand?"
lessons = ["b04-the-test-suite"]
cache = "corpora/testsuite/b04.json"
why = """
Offline in the registry's sense and not in the ordinary one. The twelve compilations behind \
this lesson are real Compiler Explorer responses, committed in the cache and listed in the \
cache field above, and running lessons/b04-the-test-suite/record.py sends every one of them \
again. What they are not is one corpus entry with one dump, which is what the online check \
compares, because they are twelve different files with twelve different command lines and \
three of them fail to compile on purpose. So the check that keeps them honest is the \
recorder's own, which asserts every behavioural fact the notebook states, and it runs against \
the recording in the test suite of this repository without a network.\
"""

[[experiment]]
id = "b05-plugin"
kind = "offline"
question = "What can you do from inside the compiler without patching it, and what stops you?"
lessons = ["b05-the-plugin"]
why = """
Offline because the subject cannot be built anywhere this checker can reach. A plugin is C++ \
compiled against GCC's private headers and loaded into the same compiler that built it, and \
Compiler Explorer will not build one, and a Colab kernel has neither the headers nor a \
matching compiler. So corpora/plug/b05.json is eleven real compilations by a real GCC 16.2.0, \
with the five plugin sources they loaded committed under gxplug/examples where a reader can \
read every line of them. What keeps it honest is that the same five plugins are built and \
loaded on four different compilers by the plugin workflow on every push that touches them, \
and lessons/b05-the-plugin/record.py re-asserts every fact the notebook states against the \
recording without compiling anything.\
"""
